# --- Logging standar ticketing-app (docs/LOGGING-STANDARD.md) ---------------
# Access log JSON dengan key yang sama seperti service Go/Java/Node. Probe
# kubelet (kube-probe) tidak dicatat agar tidak membanjiri pipeline log.
map $http_user_agent $log_loggable {
    ~*kube-probe 0;
    default      1;
}
map $status $log_level {
    ~^5     ERROR;
    ~^4     WARN;
    default INFO;
}
map $http_x_request_id $log_request_id {
    ""      $request_id;
    default $http_x_request_id;
}
map $http_traceparent $log_trace_id {
    "~^00-(?<tid>[0-9a-f]{32})-" $tid;
    default "";
}
log_format json_standard escape=json
    '{"timestamp":"$time_iso8601","level":"$log_level","message":"http request",'
    '"service.name":"frontend","deployment.environment":"dev","log.type":"access",'
    '"request_id":"$log_request_id","trace_id":"$log_trace_id",'
    '"http.request.method":"$request_method","url.path":"$uri",'
    '"http.response.status_code":$status,"http.response.body.size":$body_bytes_sent,'
    '"duration_s":$request_time,"client.address":"$remote_addr",'
    '"user_agent.original":"$http_user_agent","http.referer":"$http_referer"}';

server {
    # Non-root nginx (nginx-unprivileged, uid 101) cannot bind ports below 1024
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    access_log /dev/stdout json_standard if=$log_loggable;

    # Disable sendfile to allow Dynatrace OneAgent to inject RUM JS tag
    sendfile off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Handle React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Additional security headers (DEVOPS-08)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content-Security-Policy in Report-Only mode: it only reports violations and
    # does NOT block, so the Dynatrace OneAgent RUM script injection is not blocked.
    # Promote to enforcing Content-Security-Policy once verified safe.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'" always;
}
