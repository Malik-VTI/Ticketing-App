apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-service
  namespace: ticketing-app
  labels:
    app: profile-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: profile-service
  template:
    metadata:
      labels:
        app: profile-service
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: profile-service
        image: malikvti/profile-service:v1.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8090
          name: http
        env:
        - name: SERVICE_VERSION
          value: "v1.2.0"
        # 8090 adalah port yang diniatkan untuk profile-service: sesuai default
        # aplikasi (src/main/resources/application.yaml -> ${PROFILE_SERVICE_PORT:8090}),
        # ConfigMap service-urls, default api-gateway/config/config.js, dan
        # docker-compose. Nilai 8085 sebelumnya bertabrakan dengan hotel-service
        # dan membuat gateway tidak pernah bisa menjangkau service ini.
        - name: PROFILE_SERVICE_PORT
          value: "8090"
        envFrom:
        - configMapRef:
            name: service-urls
        - secretRef:
            name: ticketing-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /profile/health
            port: 8090
          initialDelaySeconds: 60
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /profile/health
            port: 8090
          initialDelaySeconds: 30
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: profile-service
  namespace: ticketing-app
  labels:
    app: profile-service
spec:
  type: ClusterIP
  ports:
  - port: 8090
    targetPort: 8090
    protocol: TCP
    name: http
  selector:
    app: profile-service
