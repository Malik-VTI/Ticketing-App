apiVersion: v1
kind: ConfigMap
metadata:
  name: service-urls
  namespace: ticketing-app
data:
  AUTH_SERVICE_URL: "http://authentication-service:8081"
  BOOKING_SERVICE_URL: "http://booking-service:8082"
  FLIGHT_SERVICE_URL: "http://flight-service:8083"
  TRAIN_SERVICE_URL: "http://train-service:8084"
  HOTEL_SERVICE_URL: "http://hotel-service:8085"
  PRICING_SERVICE_URL: "http://pricing-service:8086"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8087"
  ADMIN_SERVICE_URL: "http://admin-service:8088"
  PAYMENT_SERVICE_URL: "http://payment-service:8089"
  PROFILE_SERVICE_URL: "http://profile-service:8090"
  # Logging standar (docs/LOGGING-STANDARD.md) — dibaca semua service via envFrom.
  DEPLOYMENT_ENV: "dev"
  LOG_LEVEL: "info"
  GIN_MODE: "release"
  # Tambahkan credential DUMMY (nilai palsu, ditandai sensitive.dummy=true) ke
  # event login/register/password/payment untuk demo masking di BindPlane.
  LOG_DEMO_SENSITIVE: "true"
